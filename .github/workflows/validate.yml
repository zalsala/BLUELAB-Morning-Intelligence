name: Validate Morning Intelligence
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=[
              'public/index.html',
              'public/assets/styles.css',
              'public/assets/news-list.css',
              'public/assets/app.js',
              'public/data/today.json'
          ]
          assert all(Path(p).exists() for p in required), 'required file missing'
          d=json.loads(Path('public/data/today.json').read_text(encoding='utf-8'))

          files=d.get('story_files',[])
          assert files == [f'stories-{i}.json' for i in range(1,6)], 'exactly five active story bundles required'

          stories=[]
          for name in files:
              p=Path('public/data')/name
              assert p.exists(), f'missing story bundle: {name}'
              chunk=json.loads(p.read_text(encoding='utf-8'))
              assert isinstance(chunk,list), f'{name} must contain a JSON list'
              stories.extend(chunk)

          assert len(stories) >= 5, 'at least five meaningful stories required'
          titles=[s.get('title') for s in stories]
          assert len(titles)==len(set(titles)), 'duplicate story titles found'
          title_set=set(titles)
          assert d.get('top_issue_title') in title_set, 'top issue not found'
          top5=d.get('top5_titles',[])
          assert len(top5) == 5, 'top5_titles must contain exactly five items'
          assert len(set(top5)) == 5, 'top5_titles must be unique'
          assert all(t in title_set for t in top5), 'top5 title missing from bundles'

          trends=d.get('trends',[])
          assert len(trends) in (0,20), 'trends must be omitted/empty or exactly 20'

          summary=d.get('final_three_line_summary',[])
          assert len(summary)==3, 'final_three_line_summary must contain exactly three lines'

          print(f'PASS: {len(stories)} stories, {len(trends)} trends')
          PY
      - name: Validate source registry
        run: python scripts/validate_source_registry.py
      - name: Test vision research collectors offline
        run: python scripts/collect_vision_research.py --self-test
      - name: Test vision research selector offline
        run: python scripts/select_vision_research.py --self-test
      - name: Test priority-news collector offline
        run: python scripts/collect_priority_news.py --self-test
      - name: Live smoke scholarly APIs
        id: live_vision
        continue-on-error: true
        run: |
          python scripts/collect_vision_research.py --days 7 --limit-per-source 2 --output artifacts/vision-research-live-candidates.json
          python scripts/select_vision_research.py --input artifacts/vision-research-live-candidates.json --output artifacts/vision-research-live-selected.json --target 10
      - name: Report live scholarly smoke
        if: always()
        run: |
          echo "live_vision_outcome=${{ steps.live_vision.outcome }}"
          if [ -f artifacts/vision-research-live-candidates.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/vision-research-live-candidates.json').read_text())
          print('LIVE candidate_count=',p.get('candidate_count'))
          print('LIVE provider/topic errors=',len(p.get('errors',[])))
          for e in p.get('errors',[])[:12]: print('LIVE ERROR',e)
          PY
          fi
          if [ -f artifacts/vision-research-live-selected.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/vision-research-live-selected.json').read_text())
          print('LIVE selected_count=',p.get('selected_count'))
          print('LIVE coverage_status=',p.get('coverage_status'))
          print('LIVE topic_counts=',p.get('topic_counts'))
          print('LIVE collector_source_counts=',p.get('collector_source_counts'))
          PY
          fi
      - name: Live smoke priority news sources
        id: live_priority
        continue-on-error: true
        run: python scripts/collect_priority_news.py --limit-per-source 10 --output artifacts/priority-news-live-candidates.json
      - name: Report priority-news smoke
        if: always()
        run: |
          echo "live_priority_outcome=${{ steps.live_priority.outcome }}"
          if [ -f artifacts/priority-news-live-candidates.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/priority-news-live-candidates.json').read_text())
          print('PRIORITY candidate_count=',p.get('candidate_count'))
          print('PRIORITY source_errors=',p.get('error_count'))
          for chapter,r in p.get('chapter_report',{}).items():
              print('PRIORITY', chapter, r)
          for e in p.get('errors',[])[:20]: print('PRIORITY ERROR',e)
          PY
          fi
      - name: Upload live smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-intelligence-live-smoke
          path: artifacts/*-live-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit source diversity
        run: python scripts/validate_sources.py
