name: Validate Morning Intelligence
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=[
              'public/index.html',
              'public/assets/styles.css',
              'public/assets/news-list.css',
              'public/assets/app.js',
              'public/data/today.json'
          ]
          assert all(Path(p).exists() for p in required), 'required file missing'
          d=json.loads(Path('public/data/today.json').read_text(encoding='utf-8'))

          files=d.get('story_files',[])
          assert files == [f'stories-{i}.json' for i in range(1,6)], 'exactly five active story bundles required'

          stories=[]
          for name in files:
              p=Path('public/data')/name
              assert p.exists(), f'missing story bundle: {name}'
              chunk=json.loads(p.read_text(encoding='utf-8'))
              assert isinstance(chunk,list), f'{name} must contain a JSON list'
              stories.extend(chunk)

          assert len(stories) >= 5, 'at least five meaningful stories required'
          titles={s.get('title') for s in stories}
          assert d.get('top_issue_title') in titles, 'top issue not found'
          top5=d.get('top5_titles',[])
          assert 1 <= len(top5) <= 5, 'top5_titles must contain 1-5 items'
          assert all(t in titles for t in top5), 'top5 title missing from bundles'

          trends=d.get('trends',[])
          assert len(trends) in (0,20), 'trends must be omitted/empty or exactly 20'

          summary=d.get('final_three_line_summary',[])
          assert len(summary)==3, 'final_three_line_summary must contain exactly three lines'

          print(f'PASS: {len(stories)} meaningful stories, {len(trends)} trends')
          PY
