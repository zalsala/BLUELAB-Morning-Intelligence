name: Validate Morning Intelligence
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deterministic-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate structural publication contract
        run: python scripts/validate_release_contract.py
      - name: Validate source registry
        run: python scripts/validate_source_registry.py
      - name: Test vision research collectors offline
        run: python scripts/collect_vision_research.py --self-test
      - name: Test vision research selector offline
        run: python scripts/select_vision_research.py --self-test
      - name: Test priority-news collector offline
        run: python scripts/collect_priority_news.py --self-test
      - name: Test priority-news selector offline
        run: python scripts/select_priority_news.py --self-test
      - name: Test YouTube signal collector offline
        run: python scripts/collect_youtube_signals.py --self-test
      - name: Validate editorial gold corpus seed
        run: python scripts/evaluate_editorial_gate.py

  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Release contract
        id: contract
        continue-on-error: true
        run: python scripts/validate_release_contract.py --release
      - name: Live scholarly acquisition
        id: vision
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python scripts/collect_vision_research.py --days 7 --limit-per-source 2 --output artifacts/vision-research-live-candidates.json
          python scripts/select_vision_research.py --input artifacts/vision-research-live-candidates.json --output artifacts/vision-research-live-selected.json --target 10
      - name: Live priority-news acquisition and editorial gate
        id: priority
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python scripts/collect_priority_news.py --limit-per-source 10 --output artifacts/priority-news-live-candidates.json
          python scripts/select_priority_news.py --input artifacts/priority-news-live-candidates.json --output artifacts/priority-news-live-selected.json --target 10
      - name: Live original YouTube signal acquisition
        id: youtube
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python scripts/collect_youtube_signals.py --limit-per-channel 15 --output artifacts/youtube-signals-live.json --selected-output artifacts/youtube-signals-selected.json
      - name: Strict source audit
        id: sources
        continue-on-error: true
        run: python scripts/validate_sources.py --strict
      - name: Editorial gold evaluation
        id: gold
        continue-on-error: true
        run: python scripts/evaluate_editorial_gate.py
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-intelligence-release-evidence
          path: artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Final release decision
        if: always()
        run: |
          echo "contract=${{ steps.contract.outcome }}"
          echo "vision=${{ steps.vision.outcome }}"
          echo "priority=${{ steps.priority.outcome }}"
          echo "youtube=${{ steps.youtube.outcome }}"
          echo "sources=${{ steps.sources.outcome }}"
          echo "gold=${{ steps.gold.outcome }}"
          failed=0
          for outcome in \
            "${{ steps.contract.outcome }}" \
            "${{ steps.vision.outcome }}" \
            "${{ steps.priority.outcome }}" \
            "${{ steps.youtube.outcome }}" \
            "${{ steps.sources.outcome }}" \
            "${{ steps.gold.outcome }}"; do
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "RELEASE_GATE=FAIL"
            exit 1
          fi
          echo "RELEASE_GATE=PASS"
