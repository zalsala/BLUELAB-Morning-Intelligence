name: Run Expanded Morning Intelligence Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run_expanded_daily_once.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: expanded-morning-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Regression tests
        run: pytest -v tests/
      - name: Run master pipeline
        run: python run_pipeline.py
      - name: Strict source QA
        run: python scripts/validate_sources.py --strict
      - name: Release contract
        run: python scripts/validate_release_contract.py --release --expected-today-kst
      - name: Publication manifest
        run: python scripts/validate_publication_manifest.py --expected-date "$(TZ=Asia/Seoul date +%F)"
      - name: Expanded PRE-SEND hard gates
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urlparse
          from zoneinfo import ZoneInfo
          data=json.loads(Path('public/data/today.json').read_text(encoding='utf-8'))
          errors=[]
          expected=datetime.now(ZoneInfo('Asia/Seoul')).strftime('%Y-%m-%d')
          meta=data.get('metadata',{})
          if meta.get('date')!=expected: errors.append(f"edition date={meta.get('date')} != {expected}")
          chapters=data.get('chapters',[])
          vision_watch=[c for c in chapters if c.get('id')=='vision-research-watch']
          general=[c for c in chapters if c.get('id')!='vision-research-watch']
          general_vision=[c for c in general if c.get('id')=='vision-optometry-ophthalmology']
          if len(general)!=15: errors.append(f'general chapters={len(general)} != 15')
          if len(general_vision)!=1: errors.append(f'general vision chapters={len(general_vision)} != 1')
          if len(vision_watch)!=1: errors.append(f'vision research watch chapters={len(vision_watch)} != 1')
          if len(chapters)!=16: errors.append(f'total chapters={len(chapters)} != 16')
          for ch in general:
              if len(ch.get('articles',[]))!=10: errors.append(f"{ch.get('name')}: {len(ch.get('articles',[]))} != 10")
          if vision_watch and len(vision_watch[0].get('articles',[]))!=10: errors.append('VISION RESEARCH WATCH != 10')
          general_articles=[a for ch in general for a in ch.get('articles',[])]
          all_articles=general_articles+(vision_watch[0].get('articles',[]) if vision_watch else [])
          if len(general_articles)!=150: errors.append(f'general articles={len(general_articles)} != 150')
          if len(all_articles)!=160: errors.append(f'all articles={len(all_articles)} != 160')
          urls=[a.get('link','') for a in all_articles]
          if len(urls)!=len(set(urls)): errors.append('cross-chapter duplicate URL remains')
          if any(urlparse(u).netloc.lower().endswith('news.google.com') for u in urls): errors.append('Google News relay URL remains')
          if len(data.get('top_5_highlights',[]))!=5: errors.append('TOP5 count != 5')
          trends=data.get('trending_keywords',[])
          if len(trends) not in (0,20): errors.append(f'Trends count={len(trends)} not 0/20')
          if len(data.get('youtube_hot_issues',[]))<10: errors.append('YouTube < 10')
          if len({v.get('channel') for v in data.get('youtube_hot_issues',[]) if v.get('channel')})<4: errors.append('YouTube channels < 4')
          if len(data.get('three_line_summary',[]))!=3: errors.append('final summary != 3 lines')
          if len(data.get('next_signals',[]))<3: errors.append('NEXT SIGNALS < 3')
          weather=data.get('weather') or {}
          if not weather.get('source') or not weather.get('source_level'): errors.append('weather provenance missing')
          if not data.get('market'): errors.append('market missing')
          expected_files=[f'stories-{i}.json' for i in range(1,6)]
          if meta.get('story_files')!=expected_files: errors.append('five story bundles metadata mismatch')
          for name in expected_files:
              rows=json.loads((Path('public/data')/name).read_text(encoding='utf-8'))
              if len(rows)!=30: errors.append(f'{name} rows={len(rows)} != 30')
              bad=[r for r in rows if r.get('freshness_note')=='발행일 확인 필요']
              if bad: errors.append(f'{name} unresolved freshness labels={len(bad)}')
          if vision_watch:
              domains=set()
              for a in vision_watch[0].get('articles',[]):
                  rw=a.get('research_watch') or {}
                  for key in ('evidence_type','study_design','clinical_meaning_ko','limitations_conflicts_ko','exact_source_url'):
                      if not rw.get(key): errors.append(f"Vision Watch missing {key}: {a.get('title','')}")
                  h=urlparse(rw.get('exact_source_url') or a.get('link','')).hostname
                  if h: domains.add(h.lower().removeprefix('www.'))
              if len(domains)<5: errors.append(f'Vision Watch domains={len(domains)} < 5')
          if errors:
              print('EXPANDED_PRE_SEND_QA=FAIL')
              for e in errors: print(' -',e)
              raise SystemExit(2)
          print('EXPANDED_PRE_SEND_QA=PASS general=150 vision_watch=10 rendered=160 bundles=30x5')
          PY
      - name: Commit production data to main
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/data/
          if git diff --staged --quiet; then
            echo 'No production data changes.'
          else
            git commit -m "chore(briefing): expanded daily morning intelligence update [$(date +'%Y-%m-%d')]"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    needs: produce
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
