name: Expand Vision General News Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vision_general_contract_patch.yml'

permissions:
  contents: write

jobs:
  patch-contract:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch production contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def rep(path, old, new, required=True):
              text=read(path)
              if old not in text:
                  if required: raise SystemExit(f'missing patch marker in {path}: {old[:100]!r}')
                  return False
              text=text.replace(old,new)
              write(path,text)
              return True

          # 1) Add independent general Vision / Optometry / Ophthalmology news chapter.
          p='pipeline/schema.py'; text=read(p)
          if '"id": "vision-optometry-ophthalmology"' not in text:
              marker='    {\n        "id": "science-future",'
              block='''    {\n        "id": "vision-optometry-ophthalmology",\n        "name": "안경 · 콘택트렌즈 · 안과 · 검안 · 시과학 · 근시관리",\n        "name_en": "Vision / Optometry / Ophthalmology",\n        "icon": "👓",\n        "description": "안경렌즈·콘택트렌즈 산업, 검안·시과학, 근시관리, 안과 임상·규제·제품 및 전문기관 동향",\n        "queries": [\n            "안경 안경렌즈 신제품",\n            "콘택트렌즈 시력 FDA 승인",\n            "근시 억제 근시관리 렌즈",\n            "검안 시과학 양안시 사시",\n            "안과 망막 녹내장 백내장 각막",\n            "myopia control optometry ophthalmology contact lens"\n        ],\n        "rss_topics": [],\n    },\n'''
              if marker not in text: raise SystemExit('schema insertion marker missing')
              text=text.replace(marker,block+marker,1); write(p,text)

          # 2) Add title-first topical relevance policy for the new chapter.
          p='pipeline/content_quality.py'; text=read(p)
          if '"vision-optometry-ophthalmology": {' not in text:
              marker='    "science-future": {'
              block='''    "vision-optometry-ophthalmology": {\n        "positive": ["안경", "안경렌즈", "콘택트렌즈", "근시", "근시관리", "검안", "안과", "시과학", "시력", "망막", "각막", "녹내장", "백내장", "사시", "양안시", "조절", "폭주", "myopia", "optometry", "ophthalmology", "contact lens", "vision science"],\n        "negative": ["카메라 렌즈", "스마트폰 렌즈", "아이돌", "아파트", "야구", "반도체 공정"],\n    },\n'''
              if marker not in text: raise SystemExit('content_quality insertion marker missing')
              text=text.replace(marker,block+marker,1); write(p,text)

          # 3) Five story bundles remain canonical, now 30 x 5 = 150 general stories.
          p='pipeline/story_bundle_writer.py'; text=read(p)
          text=text.replace('140 general-news records','150 general-news records')
          text=text.replace('len(articles) != 140','len(articles) != 150')
          text=text.replace('exactly 140 general articles','exactly 150 general articles')
          text=text.replace('len({s["url"] for s in stories}) != 140','len({s["url"] for s in stories}) != 150')
          text=text.replace('requires 140 unique general article URLs','requires 150 unique general article URLs')
          text=text.replace('idx * 28:(idx + 1) * 28','idx * 30:(idx + 1) * 30')
          text=text.replace('len(chunk) != 28','len(chunk) != 30')
          text=text.replace('expected 28 records','expected 30 records')
          text=text.replace('28 x 5 = 140 general stories','30 x 5 = 150 general stories')
          text=text.replace('len(today_urls) != 140 or len(set(today_urls)) != 140','len(today_urls) != 150 or len(set(today_urls)) != 150')
          text=text.replace('today.json must contain 140 unique general article URLs','today.json must contain 150 unique general article URLs')
          text=text.replace('len(rows) != 28','len(rows) != 30')
          text=text.replace('expected list of 28 stories','expected list of 30 stories')
          text=text.replace('len(bundle_urls) != 140 or len(set(bundle_urls)) != 140','len(bundle_urls) != 150 or len(set(bundle_urls)) != 150')
          text=text.replace('story bundles must contain 140 unique URLs','story bundles must contain 150 unique URLs')
          text=text.replace('general_records=140 unique_urls=140','general_records=150 unique_urls=150')
          write(p,text)

          # 4) Master pipeline metadata/counts become 15 general + 1 research watch = 160 rendered.
          p='run_pipeline.py'; text=read(p)
          old='''        bundle.metadata["general_chapters"]=14; bundle.metadata["general_articles"]=140\n        bundle.metadata["total_chapters"]=15; bundle.metadata["total_articles"]=150'''
          new='''        bundle.metadata["general_chapters"]=len(bundle.chapters)-1; bundle.metadata["general_articles"]=len(articles)\n        bundle.metadata["total_chapters"]=len(bundle.chapters); bundle.metadata["total_articles"]=len(articles)+10'''
          if old not in text: raise SystemExit('run_pipeline metadata marker missing')
          text=text.replace(old,new,1)
          old='''        content_counts={"total_chapters":len(bundle.chapters),"total_articles":150,"general_chapters":14,"general_articles":140,"vision_research_watch":10,'''
          new='''        content_counts={"total_chapters":len(bundle.chapters),"total_articles":len(articles)+10,"general_chapters":len(bundle.chapters)-1,"general_articles":len(articles),"vision_research_watch":10,'''
          if old not in text: raise SystemExit('run_pipeline content_counts marker missing')
          text=text.replace(old,new,1)
          text=text.replace('일반 14개/140기사 + Vision Research Watch 10건','일반 15개/150기사 + Vision Research Watch 10건')
          write(p,text)

          # 5) Core QA contract.
          p='scripts/qa_gate.py'; text=read(p)
          text=text.replace('EXPECTED_GENERAL_CHAPTERS=14','EXPECTED_GENERAL_CHAPTERS=15')
          text=text.replace('EXPECTED_GENERAL_ARTICLES=140','EXPECTED_GENERAL_ARTICLES=150')
          text=text.replace('!= 14")','!= 15")')
          text=text.replace('if vision_enabled and len(chapters)!=15:', 'if vision_enabled and len(chapters)!=16:')
          text=text.replace('rendered chapter count={len(chapters)} != 15','rendered chapter count={len(chapters)} != 16')
          text=text.replace('if not vision_enabled and len(chapters)!=14:', 'if not vision_enabled and len(chapters)!=15:')
          text=text.replace('chapter count={len(chapters)} != 14','chapter count={len(chapters)} != 15')
          text=text.replace('general articles={len(general_articles)} != 140','general articles={len(general_articles)} != 150')
          text=text.replace('expected_total=150 if vision_enabled else 140','expected_total=160 if vision_enabled else 150')
          text=text.replace('canonical 140 general-story snapshot','canonical 150 general-story snapshot')
          text=text.replace('general_chapters=14 general_articles=140','general_chapters=15 general_articles=150')
          write(p,text)

          # 6) Strict source QA.
          p='scripts/validate_sources.py'; text=read(p)
          text=text.replace('len(expected_sections)!=14', 'len(expected_sections)!=15')
          text=text.replace('expected 14 named chapters', 'expected 15 named chapters')
          text=text.replace('len(stories)!=140', 'len(stories)!=150')
          text=text.replace('story bundle count={len(stories)} != 140','story bundle count={len(stories)} != 150')
          write(p,text)

          # 7) Release contract.
          p='scripts/validate_release_contract.py'; text=read(p)
          text=text.replace('if len(general)!=14:', 'if len(general)!=15:')
          text=text.replace('general chapter count={len(general)} != 14','general chapter count={len(general)} != 15')
          text=text.replace('if len(articles)!=140:', 'if len(articles)!=150:')
          text=text.replace('general rendered article total={len(articles)} != 140','general rendered article total={len(articles)} != 150')
          text=text.replace('if vision and len(chapters)!=15:', 'if vision and len(chapters)!=16:')
          text=text.replace('total rendered chapter count={len(chapters)} != 15','total rendered chapter count={len(chapters)} != 16')
          text=text.replace('if len(bundled)!=140:', 'if len(bundled)!=150:')
          text=text.replace('story bundle total={len(bundled)} != 140','story bundle total={len(bundled)} != 150')
          text=text.replace('the 140 general article URLs','the 150 general article URLs')
          write(p,text)

          # 8) Daily PRE-SEND hard gates.
          p='.github/workflows/daily_briefing.yml'; text=read(p)
          text=text.replace('if len(general) != 14:', 'if len(general) != 15:')
          text=text.replace("general chapter count={len(general)} != 14", "general chapter count={len(general)} != 15")
          text=text.replace('if len(chapters) != 15:', 'if len(chapters) != 16:')
          text=text.replace("total rendered chapter count={len(chapters)} != 15", "total rendered chapter count={len(chapters)} != 16")
          text=text.replace('if len(general_articles) != 140:', 'if len(general_articles) != 150:')
          text=text.replace("general article count={len(general_articles)} != 140", "general article count={len(general_articles)} != 150")
          text=text.replace('if len(all_articles) != 150:', 'if len(all_articles) != 160:')
          text=text.replace("total rendered article count={len(all_articles)} != 150", "total rendered article count={len(all_articles)} != 160")
          write(p,text)

          # 9) Branch validation follows the expanded canonical contract.
          p='.github/workflows/branch_validation.yml'; text=read(p)
          text=text.replace("if len(chapters) != 14:", "if len(chapters) not in (15,16):")
          text=text.replace("chapter count={len(chapters)} != 14", "chapter count={len(chapters)} not in (15,16)")
          write(p,text)

          # 10) Cloudflare browser QA requires the expanded live DOM.
          p='.github/workflows/cloudflare_live_qa.yml'; text=read(p)
          text=text.replace('if(state.articles < 150)', 'if(state.articles < 160)')
          text=text.replace('rendered article rows=${state.articles} < 150', 'rendered article rows=${state.articles} < 160')
          text=text.replace('if(state.chapterTabs < 16)', 'if(state.chapterTabs < 17)')
          text=text.replace('chapter tabs=${state.chapterTabs} < 16', 'chapter tabs=${state.chapterTabs} < 17')
          write(p,text)

          # 11) UI labels; article/chapter counts remain data-driven elsewhere.
          p='public/index.html'; text=read(p)
          text=text.replace('14개 챕터 140개 인텔리전스 뉴스','15개 챕터 150개 인텔리전스 뉴스')
          text=text.replace('14개 챕터 인텔리전스 (140)','15개 챕터 인텔리전스 (150)')
          text=text.replace('140 Intelligence Nodes','150 Intelligence Nodes')
          text=text.replace('전체 챕터 (140)','전체 챕터 (150)')
          text=text.replace('140 Curated Intelligence Articles','150 Curated Intelligence Articles')
          write(p,text)

          # 12) Regression fixtures now include the new general vision chapter.
          for p in ['tests/test_qa_gate_contract.py','tests/test_release_pipeline.py']:
              text=read(p)
              if '"vision-optometry-ophthalmology"' not in text:
                  text=text.replace('"culture-entertainment", "science-future",', '"culture-entertainment", "vision-optometry-ophthalmology", "science-future",')
                  text=text.replace('"society-environment", "culture-entertainment", "science-future"', '"society-environment", "culture-entertainment", "vision-optometry-ophthalmology", "science-future"')
              text=text.replace('"total_chapters": 14', '"total_chapters": 15')
              text=text.replace('"total_articles": 140', '"total_articles": 150')
              write(p,text)

          # 13) Cosmetic logs/docs: no runtime contract depends on these values.
          for p in ['pipeline/fetch_and_filter.py','pipeline/scarcity_snapshot_arbiter.py','pipeline/snapshot_arbiter.py']:
              text=read(p)
              text=text.replace('14개 챕터', '15개 챕터').replace('14개 전 챕터', '15개 전 챕터')
              text=text.replace('({idx:02d}/14)', '({idx:02d}/15)')
              write(p,text)

          print('VISION_GENERAL_CONTRACT_PATCH=APPLIED')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Regression tests
        run: pytest -q tests/
      - name: Static contract checks
        run: |
          python -m compileall -q pipeline scripts run_pipeline.py
          python - <<'PY'
          from pipeline.schema import CHAPTER_DEFINITIONS
          from pipeline.content_quality import CHAPTER_RELEVANCE
          assert len(CHAPTER_DEFINITIONS)==15, len(CHAPTER_DEFINITIONS)
          assert 'vision-optometry-ophthalmology' in CHAPTER_RELEVANCE
          print('STATIC_CONTRACT=PASS general_chapters=15')
          PY
      - name: Commit expanded contract
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add pipeline/ scripts/ tests/ run_pipeline.py public/index.html .github/workflows/daily_briefing.yml .github/workflows/branch_validation.yml .github/workflows/cloudflare_live_qa.yml
          git commit -m "feat: add independent vision optometry ophthalmology news chapter"
          git pull --rebase origin main
          git push origin main
