name: Apply Two-Column Chapter Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui_two_column_patch.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch chapter layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '<section id="chapterBlocksContainer" class="space-y-8 pb-16">',
                  '<section id="chapterBlocksContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-5 pb-16">'
              ),
              (
                  "    let isAllExpanded = false;\n    let currentFontSize = localStorage.getItem('bluelab_fontsize') || 'normal';",
                  "    let isAllExpanded = false;\n    let expandedChapterLists = new Set();\n    let currentFontSize = localStorage.getItem('bluelab_fontsize') || 'normal';"
              ),
              (
                  "      const container = document.getElementById('chapterBlocksContainer');\n      const chapters = briefingData.chapters || [];",
                  "      const container = document.getElementById('chapterBlocksContainer');\n      const chapters = briefingData.chapters || [];\n      container.className = currentChapterFilter === 'all'\n        ? 'grid grid-cols-1 lg:grid-cols-2 gap-5 pb-16 items-start'\n        : 'grid grid-cols-1 gap-5 pb-16';"
              ),
              (
                  '<div id="art-row-${art.id}" class="article-row border-b border-slate-100 dark:border-slate-800 last:border-b-0 transition duration-150">',
                  '<div id="art-row-${art.id}" class="article-row ${(!searchTerm && !currentKeywordFilter && !isBookmarkOnly && idx >= 5 && !expandedChapterLists.has(ch.id)) ? \'hidden\' : \'\'} border-b border-slate-100 dark:border-slate-800 last:border-b-0 transition duration-150">'
              ),
              (
                  '>\n                  펼치기/접기\n                </button>',
                  '>\n                  상세 전체 열기/닫기\n                </button>'
              ),
              (
                  "            <div class=\"divide-y divide-slate-100 dark:divide-slate-800\">\n              ${chapterRowsHTML}\n            </div>\n\n          </div>",
                  "            <div class=\"divide-y divide-slate-100 dark:divide-slate-800\">\n              ${chapterRowsHTML}\n            </div>\n\n            ${arts.length > 5 && !searchTerm && !currentKeywordFilter && !isBookmarkOnly ? `\n            <div class=\"border-t border-slate-200 dark:border-darkbg-border p-3 bg-slate-50/70 dark:bg-darkbg-subtle/40\">\n              <button\n                onclick=\"toggleChapterList('${ch.id}')\"\n                class=\"w-full py-2.5 rounded-xl border border-sky-300/70 dark:border-sky-700/70 bg-white dark:bg-darkbg-card hover:bg-sky-50 dark:hover:bg-sky-950/30 text-sky-700 dark:text-sky-300 text-sm font-black transition flex items-center justify-center gap-2\"\n                aria-expanded=\"${expandedChapterLists.has(ch.id) ? 'true' : 'false'}\"\n              >\n                <span class=\"w-6 h-6 rounded-full bg-sky-500 text-white inline-flex items-center justify-center text-lg leading-none\">${expandedChapterLists.has(ch.id) ? '−' : '+'}</span>\n                <span>${expandedChapterLists.has(ch.id) ? '나머지 기사 접기' : `나머지 ${arts.length - 5}개 기사 더 보기`}</span>\n              </button>\n            </div>\n            ` : ''}\n\n          </div>"
              ),
              (
                  "    // Render YouTube Hot Issues View\n    function renderYouTubeView() {",
                  "    // Show/hide the second half of a chapter list.\n    function toggleChapterList(chapterId) {\n      if (expandedChapterLists.has(chapterId)) expandedChapterLists.delete(chapterId);\n      else expandedChapterLists.add(chapterId);\n      renderArticles();\n    }\n\n    // Render YouTube Hot Issues View\n    function renderYouTubeView() {"
              ),
              (
                  "    function scrollToArticle(articleId) {\n      switchMainView('news');\n      filterByChapter('all');\n      setTimeout(() => {",
                  "    function scrollToArticle(articleId) {\n      switchMainView('news');\n      const ownerChapter = (briefingData?.chapters || []).find(ch => (ch.articles || []).some(a => a.id === articleId));\n      if (ownerChapter) expandedChapterLists.add(ownerChapter.id);\n      filterByChapter('all');\n      setTimeout(() => {"
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'patch marker mismatch: expected 1 occurrence, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate UI patch
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('public/index.html').read_text(encoding='utf-8')
          checks = {
              'desktop two-column grid': 'lg:grid-cols-2 gap-5 pb-16 items-start',
              'five-story initial cutoff': 'idx >= 5 && !expandedChapterLists.has(ch.id)',
              'chapter list state': 'let expandedChapterLists = new Set();',
              'plus control': "나머지 ${arts.length - 5}개 기사 더 보기",
              'toggle function': 'function toggleChapterList(chapterId)',
              'hidden article deep-link recovery': 'if (ownerChapter) expandedChapterLists.add(ownerChapter.id);',
              'mobile single column': 'grid grid-cols-1 lg:grid-cols-2',
          }
          missing = [name for name, needle in checks.items() if needle not in text]
          if missing:
              raise SystemExit('UI_PATCH_QA=FAIL: ' + ', '.join(missing))
          print('UI_PATCH_QA=PASS')
          PY

      - name: Commit patched UI
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/index.html
          git diff --staged --check
          if git diff --staged --quiet; then
            echo "No UI changes detected."
          else
            git commit -m "feat(ui): show five stories per chapter in two-column layout"
            git pull --rebase origin main
            git push origin main
          fi
