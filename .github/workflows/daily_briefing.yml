name: Daily Morning Intelligence Briefing

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily_briefing.yml'
      - 'pipeline/**'
      - 'run_pipeline.py'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-briefing:
    name: Run Intelligence Pipeline & Commit Data
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip'}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Deterministic Regression Tests
        run: pytest -v tests/
      - name: Run Master Pipeline
        run: python run_pipeline.py
      - name: Strict Source QA
        run: python scripts/validate_sources.py --strict
      - name: Release Contract
        run: python scripts/validate_release_contract.py --release --expected-today-kst
      - name: Validate Publication Manifest
        run: python scripts/validate_publication_manifest.py --expected-date "$(TZ=Asia/Seoul date +%F)"
      - name: PRE-SEND hard gates
        run: python scripts/validate_pre_send.py --expected-today-kst
      - name: Commit and push updated briefing data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore(briefing): daily morning intelligence update [$(date +'%Y-%m-%d')]"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-and-briefing
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
