name: Daily Morning Intelligence Briefing

on:
  schedule:
    # 매일 아침 05:30 KST = 전날 20:30 UTC
    - cron: '30 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily_briefing.yml'
      - 'pipeline/**'
      - 'run_pipeline.py'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-briefing:
    name: Run Intelligence Pipeline & Commit Data
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip'}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic Regression Tests
        run: pytest -v tests/

      - name: Run Master Pipeline
        run: python run_pipeline.py

      - name: Strict Source QA
        run: python scripts/validate_sources.py --strict

      - name: Release Contract
        run: python scripts/validate_release_contract.py --release --expected-today-kst

      - name: Validate Publication Manifest
        run: python scripts/validate_publication_manifest.py --expected-date "$(TZ=Asia/Seoul date +%F)"

      - name: PRE-SEND hard gates
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urlparse
          from zoneinfo import ZoneInfo

          data=json.loads(Path('public/data/today.json').read_text(encoding='utf-8'))
          errors=[]
          expected=datetime.now(ZoneInfo('Asia/Seoul')).strftime('%Y-%m-%d')
          if data.get('metadata',{}).get('date') != expected:
              errors.append(f"edition date mismatch: {data.get('metadata',{}).get('date')} != {expected}")
          chapters=data.get('chapters',[])
          if len(chapters) != 14:
              errors.append(f'chapter count={len(chapters)} != 14')
          for ch in chapters:
              if len(ch.get('articles',[])) < 10:
                  errors.append(f"{ch.get('name')}: rendered items={len(ch.get('articles',[]))} < 10")
          articles=[a for ch in chapters for a in ch.get('articles',[])]
          article_urls=[a.get('link','') for a in articles]
          if len(article_urls) != len(set(article_urls)):
              errors.append('cross-chapter exact URL duplicates remain')
          top5=data.get('top_5_highlights',[])
          if len(top5) != 5:
              errors.append(f'TOP5 count={len(top5)} != 5')
          videos=data.get('youtube_hot_issues',[])
          channels={v.get('channel') for v in videos if v.get('channel')}
          if len(videos) < 10:
              errors.append(f'YouTube count={len(videos)} < 10')
          if len(channels) < 4:
              errors.append(f'YouTube unique channels={len(channels)} < 4')
          urls=article_urls+[a.get('link','') for a in top5]
          google_news=[u for u in urls if urlparse(u).netloc.lower().endswith('news.google.com')]
          if google_news:
              errors.append(f'exact article URL gate: {len(google_news)} Google News relay URLs remain')
          trends=data.get('trending_keywords',[])
          if len(trends) not in (0,20):
              errors.append(f'trending keyword count must be 0 or 20; found {len(trends)}')
          if len(data.get('three_line_summary',[])) != 3:
              errors.append('final summary must contain exactly 3 lines')
          if errors:
              print('PRE_SEND_QA=FAIL')
              for e in errors: print(' -',e)
              raise SystemExit(2)
          print('PRE_SEND_QA=PASS')
          PY

      - name: Commit and push updated briefing data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore(briefing): daily morning intelligence update [$(date +'%Y-%m-%d')]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-and-briefing
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
