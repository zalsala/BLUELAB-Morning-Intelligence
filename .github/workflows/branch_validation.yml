name: Branch Live Validation

on:
  push:
    branches:
      - 'agent/**'
      - 'remediation/**'
    paths:
      - '.github/workflows/branch_validation.yml'
      - '.github/workflows/daily_briefing.yml'
      - 'pipeline/**'
      - 'run_pipeline.py'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  live-validation:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip'}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Deterministic Regression Tests
        run: pytest -v tests/
      - name: Run master pipeline without publishing
        run: python run_pipeline.py
      - name: Strict Source QA
        run: python scripts/validate_sources.py --strict
      - name: Release Contract
        run: python scripts/validate_release_contract.py --release --expected-today-kst
      - name: Validate Publication Manifest
        run: python scripts/validate_publication_manifest.py --expected-date "$(TZ=Asia/Seoul date +%F)"
      - name: PRE-SEND hard gates
        run: python scripts/validate_pre_send.py --expected-today-kst
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-live-validation
          path: public/data/*.json
          if-no-files-found: ignore
          retention-days: 2
