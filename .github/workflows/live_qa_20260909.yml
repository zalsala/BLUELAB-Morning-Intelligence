name: Live QA 2026-09-09
on:
  push:
    branches: [main]
    paths: ['.github/workflows/live_qa_20260909.yml']
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://bluelab-morning-intelligence.zalsala82.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify live JSON identity
        run: |
          python - <<'PY'
          import json,urllib.request,time
          from pathlib import Path
          local=json.loads(Path('public/data/publication_manifest.json').read_text())
          expected=local['edition_date']; expected_prod=local['fingerprints']['production_fingerprint_sha256']
          last=None
          for i in range(12):
              try:
                  def get(p):
                      r=urllib.request.Request('$BASE_URL'+p,headers={'User-Agent':'BLUELAB-Live-QA/20260909','Cache-Control':'no-cache'})
                      return json.loads(urllib.request.urlopen(r,timeout=15).read())
                  remote=get('/data/publication_manifest.json'); today=get('/data/today.json')
                  if remote.get('edition_date')==expected and (remote.get('fingerprints') or {}).get('production_fingerprint_sha256')==expected_prod and (today.get('metadata') or {}).get('date')==expected and len(today.get('three_line_summary') or [])==3:
                      print('CLOUDFLARE_READBACK=PASS'); break
                  last=(remote.get('edition_date'),(today.get('metadata') or {}).get('date'))
              except Exception as e: last=repr(e)
              time.sleep(10)
          else: raise SystemExit('CLOUDFLARE_READBACK=FAIL '+str(last))
          PY
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser interaction QA
        run: |
          cat > /tmp/qa.mjs <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          for(const p of [{n:'desktop',w:1440,h:1000},{n:'mobile',w:390,h:844}]){
            const page=await browser.newPage({viewport:{width:p.w,height:p.h}}); const errs=[]; page.on('pageerror',e=>errs.push(String(e)));
            const r=await page.goto(process.env.BASE_URL,{waitUntil:'domcontentloaded',timeout:60000}); if(!r?.ok()) throw new Error(`${p.n} HTTP`);
            await page.waitForFunction(()=>document.querySelectorAll('.article-row').length>=150,{timeout:60000});
            const s=await page.evaluate(()=>({date:document.querySelector('#headerDateText')?.textContent||'',arts:document.querySelectorAll('.article-row').length,tabs:document.querySelectorAll('.chapter-tab').length,text:document.body.innerText,sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            if(!s.date.includes('2026년 09월 09일')||s.arts<150||s.tabs<16||!s.text.includes('NEXT SIGNALS')||s.sw>s.cw+2||errs.length) throw new Error(`${p.n} render gate failed ${JSON.stringify(s)} ${errs}`);
            const first=page.locator('.article-row').first(); const detail=first.locator('.editorial-content').first(); await first.locator(':scope > div').first().click(); if(await detail.evaluate(el=>el.classList.contains('hidden'))) throw new Error(`${p.n} detail did not open`); await first.locator(':scope > div').first().click();
            const link=first.locator('a[href^="http"]').first(); if(!(await link.count())) throw new Error(`${p.n} source link missing`);
            console.log(`${p.n.toUpperCase()}_LIVE_QA=PASS arts=${s.arts} tabs=${s.tabs}`); await page.close();
          }
          await browser.close(); console.log('CLOUDFLARE_BROWSER_QA=PASS');
          JS
          node /tmp/qa.mjs