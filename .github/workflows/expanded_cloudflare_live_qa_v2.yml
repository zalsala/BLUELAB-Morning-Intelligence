name: Expanded Cloudflare Live QA V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expanded_cloudflare_live_qa_v2.yml'

permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://bluelab-morning-intelligence.zalsala82.workers.dev
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read expected identity
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          m=json.loads(Path('public/data/publication_manifest.json').read_text(encoding='utf-8'))
          print('EXPECTED_EDITION='+m['edition'])
          print('EXPECTED_DATE='+m['edition_date'])
          print('EXPECTED_PRODUCTION_SHA='+m['fingerprints']['production_fingerprint_sha256'])
          PY
      - name: Cloudflare production JSON read-back
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['BASE_URL'].rstrip('/')
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'BLUELAB-Expanded-Live-QA/2.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read().decode('utf-8'))
          m=get('/data/publication_manifest.json'); d=get('/data/today.json')
          chapters=d.get('chapters') or []; general=[c for c in chapters if c.get('id')!='vision-research-watch']
          assert m.get('edition')==os.environ['EXPECTED_EDITION']
          assert m.get('edition_date')==os.environ['EXPECTED_DATE']
          assert (m.get('fingerprints') or {}).get('production_fingerprint_sha256')==os.environ['EXPECTED_PRODUCTION_SHA']
          assert (d.get('metadata') or {}).get('date')==os.environ['EXPECTED_DATE']
          assert len(general)==15 and len(chapters)==16
          assert len([c for c in chapters if c.get('id')=='vision-research-watch'])==1
          assert len([c for c in general if c.get('id')=='vision-optometry-ophthalmology'])==1
          assert len(d.get('three_line_summary') or [])==3
          print('CLOUDFLARE_EXPANDED_READBACK=PASS')
          PY
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Desktop/mobile DOM and interaction QA
        run: |
          cat > .live.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            for (const p of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]) {
              const page=await browser.newPage({viewport:{width:p.width,height:p.height}}); const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
              const resp=await page.goto(process.env.BASE_URL,{waitUntil:'domcontentloaded',timeout:60000}); if(!resp?.ok()) throw new Error(`${p.name}: HTTP ${resp?.status()}`);
              await page.waitForFunction(()=>document.querySelectorAll('.article-row').length>=160,{timeout:60000});
              const s=await page.evaluate(()=>({
                rows:document.querySelectorAll('.article-row').length,
                tabs:document.querySelectorAll('.chapter-tab').length,
                cards:document.querySelectorAll('[id^="chapter-block-"]').length,
                hasVisionGeneral:!!document.querySelector('#chapter-block-vision-optometry-ophthalmology'),
                hasVisionWatch:!!document.querySelector('#chapter-block-vision-research-watch'),
                links:document.querySelectorAll('.article-row a[href]').length,
                text:document.body.innerText,
                sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth
              }));
              if(s.rows!==160) throw new Error(`${p.name}: rows=${s.rows}`);
              if(s.tabs<17) throw new Error(`${p.name}: tabs=${s.tabs}`);
              if(s.cards!==16) throw new Error(`${p.name}: cards=${s.cards}`);
              if(!s.hasVisionGeneral) throw new Error(`${p.name}: vision general DOM missing`);
              if(!s.hasVisionWatch) throw new Error(`${p.name}: vision watch DOM missing`);
              if(!s.text.includes('NEXT SIGNALS')) throw new Error(`${p.name}: NEXT SIGNALS missing`);
              if(s.sw>s.cw+2) throw new Error(`${p.name}: horizontal overflow ${s.sw}>${s.cw}`);
              if(pageErrors.length) throw new Error(`${p.name}: ${pageErrors.join(' | ')}`);
              const first=page.locator('.article-row').first(); const detail=first.locator('.editorial-content').first();
              await first.locator(':scope > div').first().click(); await page.waitForTimeout(120);
              if(await detail.evaluate(el=>el.classList.contains('hidden'))) throw new Error(`${p.name}: title-detail open failed`);
              await first.locator(':scope > div').first().click(); await page.waitForTimeout(100);
              if(!(await detail.evaluate(el=>el.classList.contains('hidden')))) throw new Error(`${p.name}: title-detail close failed`);
              const href=await page.locator('.article-row a[href]').first().getAttribute('href'); if(!href?.startsWith('http')) throw new Error(`${p.name}: invalid source href`);
              const plus=page.getByRole('button',{name:/나머지 .*개 기사 더 보기/}).first(); if(await plus.count()){await plus.click(); await page.waitForTimeout(100);}
              console.log(`${p.name.toUpperCase()}_LIVE_QA=PASS rows=${s.rows} tabs=${s.tabs} cards=${s.cards} links=${s.links}`);
              await page.close();
            }
            console.log('CLOUDFLARE_EXPANDED_BROWSER_QA=PASS');
          } finally {await browser.close();}
          JS
          node .live.mjs
