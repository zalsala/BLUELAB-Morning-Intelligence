name: UI Layout Live QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui_layout_live_qa.yml'

permissions:
  contents: read

jobs:
  live-ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://bluelab-morning-intelligence.zalsala82.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for current UI deployment
        run: |
          python - <<'PY'
          import os, time, urllib.request
          base=os.environ['BASE_URL'].rstrip('/')
          last=''
          for attempt in range(1,19):
              try:
                  req=urllib.request.Request(base+'/?uiqa='+str(time.time()), headers={'User-Agent':'BLUELAB-UI-QA/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      html=r.read().decode('utf-8','replace')
                  if 'toggleChapterList' in html and 'lg:grid-cols-2 gap-5 pb-16' in html:
                      print(f'LIVE_UI_CODE=PASS attempt={attempt}')
                      break
                  last='new layout markers not present yet'
                  print(f'attempt={attempt}: {last}')
              except Exception as e:
                  last=f'{type(e).__name__}: {e}'
                  print(f'attempt={attempt}: {last}')
              if attempt < 18: time.sleep(10)
          else:
              raise SystemExit('LIVE_UI_CODE=FAIL: '+last)
          PY

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify desktop and mobile layout interactions
        run: |
          cat > .ui-layout-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const base=process.env.BASE_URL;
          const browser=await chromium.launch({headless:true});
          const visibleCount=async loc => {
            let n=0;
            for(let i=0;i<await loc.count();i++) if(await loc.nth(i).isVisible()) n++;
            return n;
          };
          try {
            const desktop=await browser.newPage({viewport:{width:1440,height:1000}});
            await desktop.goto(base+'/?uiqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await desktop.waitForFunction(()=>document.querySelectorAll('.article-row').length>=150,{timeout:60000});
            const blocks=desktop.locator('[id^="chapter-block-"]');
            if(await blocks.count()!==15) throw new Error(`desktop chapter blocks=${await blocks.count()} != 15`);
            const allRows=desktop.locator('.article-row');
            const initialVisible=await visibleCount(allRows);
            if(initialVisible!==75) throw new Error(`desktop initial visible rows=${initialVisible} != 75`);
            const b0=await blocks.nth(0).boundingBox();
            const b1=await blocks.nth(1).boundingBox();
            if(!b0||!b1) throw new Error('desktop chapter boxes missing');
            if(Math.abs(b0.y-b1.y)>8 || Math.abs(b0.x-b1.x)<200) throw new Error(`desktop not two-column: b0=${JSON.stringify(b0)} b1=${JSON.stringify(b1)}`);
            const first=blocks.nth(0);
            const firstRows=first.locator('.article-row');
            if(await visibleCount(firstRows)!==5) throw new Error('first chapter does not start at 5 visible stories');
            const more=first.getByRole('button',{name:/나머지 .*기사 더 보기/});
            if(await more.count()!==1) throw new Error('chapter + more button missing');
            await more.click();
            if(await visibleCount(desktop.locator('[id^="chapter-block-"]').nth(0).locator('.article-row'))!==10) throw new Error('chapter + button did not reveal 10 stories');
            const collapse=desktop.locator('[id^="chapter-block-"]').nth(0).getByRole('button',{name:/나머지 기사 접기/});
            if(await collapse.count()!==1) throw new Error('chapter collapse control missing after expansion');
            await collapse.click();
            if(await visibleCount(desktop.locator('[id^="chapter-block-"]').nth(0).locator('.article-row'))!==5) throw new Error('chapter collapse did not restore 5 stories');
            const firstRow=desktop.locator('[id^="chapter-block-"]').nth(0).locator('.article-row').first();
            const detail=firstRow.locator('.editorial-content');
            if(await detail.isVisible()) throw new Error('article detail unexpectedly open initially');
            await firstRow.locator(':scope > div').first().click();
            if(!(await detail.isVisible())) throw new Error('article title/detail interaction failed');
            const ds=await desktop.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            if(ds.sw>ds.cw+2) throw new Error(`desktop horizontal overflow ${ds.sw}>${ds.cw}`);
            console.log('DESKTOP_UI_QA=PASS');

            const mobile=await browser.newPage({viewport:{width:390,height:844}});
            await mobile.goto(base+'/?uiqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await mobile.waitForFunction(()=>document.querySelectorAll('.article-row').length>=150,{timeout:60000});
            const mblocks=mobile.locator('[id^="chapter-block-"]');
            if(await mblocks.count()!==15) throw new Error(`mobile chapter blocks=${await mblocks.count()} != 15`);
            if(await visibleCount(mobile.locator('.article-row'))!==75) throw new Error('mobile initial visible rows != 75');
            const m0=await mblocks.nth(0).boundingBox();
            const m1=await mblocks.nth(1).boundingBox();
            if(!m0||!m1) throw new Error('mobile chapter boxes missing');
            if(m1.y<=m0.y+m0.height-8) throw new Error(`mobile did not stack chapters: m0=${JSON.stringify(m0)} m1=${JSON.stringify(m1)}`);
            const ms=await mobile.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            if(ms.sw>ms.cw+2) throw new Error(`mobile horizontal overflow ${ms.sw}>${ms.cw}`);
            console.log('MOBILE_UI_QA=PASS');
            console.log('UI_LAYOUT_LIVE_QA=PASS');
          } finally {
            await browser.close();
          }
          JS
          node .ui-layout-qa.mjs
